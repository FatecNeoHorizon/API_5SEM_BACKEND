databaseChangeLog:
  - changeSet:
      id: create-dim-status
      author: vinicius
      changes:
        - createTable:
            tableName: dim_status
            columns:
              - column:
                  name: status_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: status_nome
                  type: VARCHAR(255)
              - column:
                  name: status_jira_id
                  type: VARCHAR(255)