# Banco H2 em memória para testes (schema criado via Liquibase)
spring.datasource.url=jdbc:h2:mem:neohorizon-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate: usa o schema criado pelo Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Liquibase ATIVADO nos testes para criar todas as tabelas (dimensões e fatos)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Porta web aleatória
server.port=0

# Usuário ETL (valores fake apenas para o contexto subir)
app.etl.email=etl_test@neohorizon.com
app.etl.password=etl_test_password

# Usuário ADMIN (valores fake só para teste)
app.admin.email=admin_test@neohorizon.com
app.admin.password=admin_test_password
